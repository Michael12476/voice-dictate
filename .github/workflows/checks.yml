name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Dummy recovery and request checks
        shell: pwsh
        run: |
          python test_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test_security.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node settings-app/test_security.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline setup check
        shell: powershell
        run: .\setup.ps1 -SelfCheck
      - name: Source syntax
        shell: pwsh
        run: |
          python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').glob('*.py')]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('settings-app/main.js', 'settings-app/preload.js', 'settings-app/renderer.js')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($file in @('setup.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$file failed parsing" }
          }
